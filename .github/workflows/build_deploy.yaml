name: Build website and deploy

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on: 
  push:
    paths:
      - '**.qmd'
      - '**.md'
      - '**.yaml'
      - '**.yml'
      - '**.scss'
      - .github/workflows/build_deploy.yaml
  workflow_dispatch:
    
jobs:

  build-web-and-deploy:

    if: contains(github.event.head_commit.message, 'preview') || github.ref == 'refs/heads/main'

    runs-on: ubuntu-24.04

    defaults:
      run:
        shell: bash -l {0}

    permissions:
      contents: write
    
    env:
      CONDA_PKG_DIR: ~/conda_pkgs_dir
      R_LIBS_USER: /tmp/Rlibs
      DEBIAN_FRONTEND: noninteractive
      QT_QPA_PLATFORM: offscreen 

    steps:
      - name: Set Env
        run: |
          echo "APT_CACHE_DIR=$RUNNER_TEMP/apt_cache" >> $GITHUB_ENV
          echo "MONTH=$(date +%B)" >> $GITHUB_ENV

      - name: ATP download settings
        run: |
          mkdir -p $APT_CACHE_DIR/partial
          echo Dir::Cache::Archives $APT_CACHE_DIR";" | sudo tee /etc/apt/apt.conf.d/50cacheDir
          echo 'APT::Keep-Downloaded-Packages "true";' | sudo tee /etc/apt/apt.conf.d/10keep-cache
      
      - name: Checkout
        uses: actions/checkout@v7

      - name: Detect R presentation changes
        id: r_changes
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "needs_r=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          BEFORE_SHA="${{ github.event.before }}"
          AFTER_SHA="${{ github.sha }}"

          if [[ -z "$BEFORE_SHA" || "$BEFORE_SHA" =~ ^0+$ ]]; then
            echo "needs_r=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          CHANGED_FILES="$(git --no-pager diff --name-only "$BEFORE_SHA" "$AFTER_SHA")"
          NEED_R=false

          while IFS= read -r file; do
            [[ -z "$file" ]] && continue

            if [[ "$file" == subjects/IDG/* || "$file" == subjects/idg.qmd || "$file" == linux_install_R.sh || "$file" == _quarto.yml || "$file" == *.R || "$file" == *.Rmd ]]; then
              NEED_R=true
              break
            fi
          done <<< "$CHANGED_FILES"

          echo "needs_r=$NEED_R" >> "$GITHUB_OUTPUT"

      - name: Cache frozen IDG presentations
        id: cache_freeze_idg
        uses: actions/cache@v6
        with:
          path: |
            _freeze/subjects/IDG/prezentace
          key: ${{ runner.os }}-freeze-idg-${{ hashFiles('subjects/IDG/prezentace/**/*.qmd', 'subjects/idg.qmd', '_quarto.yml') }}

      - name: Cache Conda
        uses: actions/cache@v6
        env:
          CACHE_NUMBER: 0
        with:
          path: ${{ env.CONDA_PKG_DIR }}
          key: ${{ runner.os }}-conda-${{ env.CACHE_NUMBER }}-${{hashFiles('conda-environment.yml') }}-${{ env.MONTH }}

      - uses: conda-incubator/setup-miniconda@v4
        with:
          activate-environment: env-vyuka
          environment-file: conda-environment.yml
          pkgs-dirs: ${{ env.CONDA_PKG_DIR }}
      
      - name: Cache APT packages
        if: steps.r_changes.outputs.needs_r == 'true' || steps.cache_freeze_idg.outputs.cache-hit != 'true'
        uses: actions/cache@v6
        env:
          CACHE_NUMBER: 0
        with:
          path: ${{ env.APT_CACHE_DIR}}
          key: ${{ runner.os }}-apt-${{ env.CACHE_NUMBER }}-${{ hashFiles('linux_install_R.sh') }}-${{ env.MONTH }}

      - name: Install R and packages
        if: steps.r_changes.outputs.needs_r == 'true' || steps.cache_freeze_idg.outputs.cache-hit != 'true'
        run: |
          sudo ./linux_install_R.sh  --all

      - name: Prepare DEV stuff
        run: |
          ./prepare_dev.sh

      - name: Setup Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        
      - name: Install extensions
        run: ./install.sh  

      - name: Render Quarto
        run: quarto render .    
      
      - name: Publish to GitHub Pages
        if: 
          contains('refs/heads/main', github.ref)
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
          render: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  
      
      - name: Deploy to Preview
        if: github.ref != 'refs/heads/main'    
        uses: peaceiris/actions-gh-pages@v4
        with:
            github_token: ${{ secrets.GITHUB_TOKEN }}
            publish_dir: _site
            publish_branch: gh-pages 
            destination_dir: _preview
      
      - name: Remove folders
        run: |
          sudo rm -rf $APT_CACHE_DIR/lock
          sudo rm -rf $APT_CACHE_DIR/partial